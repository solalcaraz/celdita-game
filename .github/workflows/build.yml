name: build

on: [push, pull_request]
jobs:
  gradle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: 14

      - run: |
          git clone https://github.com/uqbar-project/wollok-cli
          wollok-cli/wollok test
        shell: bash

